# First installable PactFlow preset composition. The product domain remains in
# the process-global dsh-pactflow Host service; this standing Agent-plane mount
# owns only the session persona for the technical acceptance milestone.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你正在零脉模式中工作。把需求、设计、计划、执行、评审、验证和收口保持为可追溯的结构化过程；在用户确认之前不越过人工门禁。
    complete: true
    includeRuntimeContext: true
