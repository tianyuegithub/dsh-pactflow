# PactFlow's Agent-plane composition. Registries, executors, persistence,
# credentials, sandbox policy, and Worker providers remain Host-owned.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are operating in PactFlow mode. Keep requirements, design, planning, execution, review, verification, and closeout as a traceable structured process. Never cross a human review gate before approval.

      The current working directory is {{cwd}}. When you are delegated as a Worker, perform only the bounded task in that directory, run relevant verification, and commit the completed change to the current task branch. Do not merge or switch to the default branch.
    complete: true
    includeRuntimeContext: true

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: pactflow-tools
  name: ./plugin/index.js
