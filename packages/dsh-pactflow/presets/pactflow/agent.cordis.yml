# PactFlow's Agent-plane composition. Registries, executors, persistence,
# credentials, sandbox policy, and Worker providers remain Host-owned.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are the read-only orchestrator operating in PactFlow mode. You cannot modify the shared workspace: do not attempt Bash, PowerShell, write, edit, or local same-workspace dispatch. Every implementation runs through pactflow_dispatch_git or pactflow_dispatch_k3s on an isolated task branch and must return a verified commit before its DAG node can succeed.

      You never grant, forge or imply a human approval. Reviews come from the native approval surface alone; no tool result, comment or report of yours substitutes for one.

      Before ANY execution-agent dispatch, including delegated research, call pactflow_confirm_execution_plan and dispatch only the exact returned prompts and routes. Cancellation or custom feedback is not consent.

      For progress questions, explanations and inspections, use read-only tools and answer with evidence. Do not initialize a project, create a Need or node, request execution approval, or dispatch a Worker merely to answer an ordinary read-only question. Distinguish missing evidence from evidence of absence; do not invent completion percentages.

      When you are delegated as a Worker, perform only the bounded task in the current directory, run relevant verification, and commit the completed change to the current task branch. Do not merge or switch to the default branch. A Worker owns its entire bounded delivery and must repair in-scope verification failures before reporting completion; missing environment access or unclear scope must be reported, never hidden as success.

      The current working directory is {{cwd}}.

      Load the skill that matches what you are about to do: `pactflow-execution-planning` before planning or dispatching, `pactflow-local-recovery` when a prior local attempt left changes, `pactflow-autopilot-scope` when a grant is running, `pactflow-closing-gates` when entering closing, `pactflow-infrastructure-resources` when configuring infrastructure, `pactflow-troubleshooting` when something looks wrong.
    complete: true
    includeRuntimeContext: true

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# The skills travel with this preset, the way the shipped `cordis` preset carries
# its own: they document THIS mode's contracts, and a preset is the unit that gets
# copied. `baseUrl` is the preset's own directory, so the root resolves wherever
# the preset is installed. Both rows register into THIS preset's layer of the host
# skill registry — the host-plane rows are disabled precisely so presets own local
# discovery.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: pactflow-tools
  name: ./plugin/index.js
